# Server time is read from this log (doc 10 §5.3). The run id comes from
# the X-Bench-Run header that k6 sends, so warm-up and runs separate cleanly.
log_format bench escape=json '{"run":"$http_x_bench_run","id":"$request_id","host":"$host",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"upstream":"$upstream_response_time","total":$request_time,"msec":$msec}';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    access_log /var/log/bench/nginx.jsonl bench;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass php:9000;
        fastcgi_buffers 16 32k;
    }
}
