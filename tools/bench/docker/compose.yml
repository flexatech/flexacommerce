# T3 benchmark stack (doc 10 §5.3). Started by tools/bench/bench.sh, never
# pointed at a real site. Images are pinned; the versions go into every report.
name: fxc-bench

services:
  db:
    image: mysql:8.0.40
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-flush-log-at-trx-commit=2
      - --skip-log-bin
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: bench
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pbench"]
      interval: 2s
      retries: 60

  php:
    build:
      context: ./php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    image: fxc-bench-php:${PHP_VERSION:-8.2}
    environment:
      FPM_WORKERS: ${FPM_WORKERS:-4}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp:/var/www/html
      - ./wp-config.php:/var/www/html/wp-config.php:ro
      - ../mu-plugins/bench-measure.php:/var/www/html/wp-content/mu-plugins/bench-measure.php:ro
      - ../mu-plugins/e2e.php:/var/www/html/wp-content/mu-plugins/e2e.php:ro
      - ../../..:/var/www/html/wp-content/plugins/flexacommerce:ro
      - ..:/bench
      - logs:/var/log/bench

  nginx:
    image: nginx:1.27.3-alpine
    depends_on: [php]
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - wp:/var/www/html:ro
      - ../../..:/var/www/html/wp-content/plugins/flexacommerce:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - logs:/var/log/bench

  k6:
    image: grafana/k6:0.55.0
    profiles: [tools]
    volumes:
      - ../k6:/scripts:ro
      - ../out:/out

volumes:
  db:
  wp:
  logs:
